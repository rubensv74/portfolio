                                                Table(
                                                    {Order:10,Key:"COVERAGE",Label:"Reconciliation coverage",ValueText:Coalesce(varAPAS_SelectedAsset.ReconciliationCoverageStatus,"UNAVAILABLE"),SupportingText:If(varAPAS_SelectedAsset.ReconciliationCoverageStatus="NOT_IN_LAST_SUCCESSFUL_SNAPSHOT","ALEP asset is newer than the last successful snapshot",If(varAPAS_SelectedAsset.ReconciliationCoverageStatus="AVAILABLE","Evaluated by the published snapshot","Reconciliation is not currently available")),Tone:If(varAPAS_SelectedAsset.ReconciliationCoverageStatus="AVAILABLE","SUCCESS","WARNING"),IsInteractive:false},
                                                    {Order:20,Key:"HCS",Label:"HCS resolution",ValueText:If(varAPAS_SelectedAsset.ReconciliationCoverageStatus<>"AVAILABLE","Unavailable",If(Upper(Coalesce(varAPAS_SelectedAsset.HcsResolutionStatus,""))="RESOLVED","Resolved",If(varAPAS_SelectedAsset.ReconciliationStatus="HCS_ELEMENT_NOT_RESOLVED","Not resolved","Data issue"))),SupportingText:If(varAPAS_SelectedAsset.ReconciliationCoverageStatus="AVAILABLE","Exact-match source result","No current reconciliation result for this ALEP identity"),Tone:If(Upper(Coalesce(varAPAS_SelectedAsset.HcsResolutionStatus,""))="RESOLVED","SUCCESS","WARNING"),IsInteractive:false},
                                                    {Order:30,Key:"ELEMENT",Label:"HCS element",ValueText:Coalesce(varAPAS_SelectedAsset.HcsElementCode,"—"),SupportingText:Coalesce(varAPAS_SelectedAsset.HcsRepresentation,"Integration metadata unavailable"),Tone:"NEUTRAL",IsInteractive:false}
                                                ),
                                                "Technical Data",
                                                Switch(
                                                    varAPAS_TechnicalDataLoadState,
                                                    "LOADING",Table({Order:10,Key:"TD_LOADING",Label:"Technical Data",ValueText:"Loading…",SupportingText:"Reading selected ALEP values and governed mappings.",Tone:"INFO",IsInteractive:false}),
                                                    "ERROR",Table({Order:10,Key:"TD_ERROR",Label:"Technical Data",ValueText:"Unavailable",SupportingText:Coalesce(varAPAS_TechnicalDataError,"Technical Data could not be loaded.") & If(!IsBlank(varAPAS_TechnicalDataErrorCode)," · " & varAPAS_TechnicalDataErrorCode,""),Tone:"WARNING",IsInteractive:false}),
                                                    "EMPTY",
                                                    Switch(
                                                        varAPAS_TechnicalDataEmptyReason,
                                                        "NO_SELECTION",Table({Order:10,Key:"TD_EMPTY_SELECTION",Label:"Technical Data",ValueText:"Select equipment",SupportingText:"Select an equipment row before opening Technical Data.",Tone:"INFO",IsInteractive:false}),
                                                        "NO_RAW_VALUES",Table({Order:10,Key:"TD_EMPTY_RAW",Label:"Technical Data",ValueText:"No ALEP technical values",SupportingText:"This equipment has no populated DS_COLUMN1..DS_COLUMN100 values in ALEP CURRENT.",Tone:"NEUTRAL",IsInteractive:false}),
                                                        "NO_CONTEXTUAL_MAPPINGS",Table({Order:10,Key:"TD_EMPTY_MAPPING",Label:"Technical Data",ValueText:"No contextual mappings",SupportingText:"ALEP technical values exist, but no confirmed mappings are configured for " & Coalesce(varAPAS_TechnicalContextKey,"this context") & ".",Tone:"WARNING",IsInteractive:false}),
                                                        "NO_GOVERNED_MATCHES",Table({Order:10,Key:"TD_EMPTY_GOVERNED",Label:"Technical Data",ValueText:"No governed matches",SupportingText:"Mappings exist, but none of the selected equipment values resolve to an active Technical Field.",Tone:"WARNING",IsInteractive:false}),
                                                        Table({Order:10,Key:"TD_EMPTY",Label:"Technical Data",ValueText:"No governed fields",SupportingText:"No governed Technical Data rows are available for this equipment.",Tone:"NEUTRAL",IsInteractive:false})
                                                    ),
                                                    "READY",colAPAS_TechnicalDataRows,
                                                    Table({Order:10,Key:"TD_IDLE",Label:"Technical Data",ValueText:"Open tab to load",SupportingText:"Technical Data is loaded lazily for the selected equipment.",Tone:"INFO",IsInteractive:false})
                                                ),
                                                "Preservation",
                                                Table(
                                                    {Order:10,Key:"STATE",Label:"State",ValueText:Coalesce(varAPAS_SelectedAsset.ReconciliationStatus,"UNAVAILABLE"),SupportingText:"Canonical Assets reconciliation state",Tone:If(varAPAS_SelectedAsset.ReconciliationStatus="PRESERVATION_REGISTERED","SUCCESS",If(IsBlank(varAPAS_SelectedAsset.ReconciliationStatus),"WARNING","INFO")),IsInteractive:false},
                                                    {Order:20,Key:"TYPE",Label:"Preservation Type",ValueText:Coalesce(varAPAS_SelectedAsset.PreservationTypeCode,varAPAS_SelectedAsset.SelectedPreservationTypeCode,"—"),SupportingText:If(varAPAS_SelectedAsset.ReconciliationStatus="PRESERVATION_DECISION_REQUIRED","Pending human decision",If(varAPAS_SelectedAsset.ReconciliationStatus="HCS_ELEMENT_NOT_RESOLVED","Blocked until exact HCS resolution",If(varAPAS_SelectedAsset.ReconciliationStatus="PRESERVATION_REGISTERED","Current HCS assignment","No final Preservation Type available"))),Tone:"NEUTRAL",IsInteractive:false}
                                                ),
                                                Table(
                                                    {Order:10,Key:"ALEP",Label:"ALEP",ValueText:"CURRENT",SupportingText:"Equipment universe authority",Tone:"INFO",IsInteractive:false},
                                                    {Order:20,Key:"RECON",Label:"Reconciliation",ValueText:Coalesce(varAPAS_SelectedAsset.ReconciliationCoverageStatus,"UNAVAILABLE"),SupportingText:"Freshness · "&Coalesce(varAPAS_FreshnessStatus,"UNAVAILABLE"),Tone:If(varAPAS_SelectedAsset.ReconciliationCoverageStatus="AVAILABLE","SUCCESS","WARNING"),IsInteractive:false},
                                                    {Order:30,Key:"DECISION",Label:"Decision Store",ValueText:Coalesce(varAPAS_SelectedAsset.DecisionStatus,"UNAVAILABLE"),SupportingText:"Read-only decision overlay",Tone:"NEUTRAL",IsInteractive:false}
                                                )
                                            )
                                          State: =If(IsBlank(varAPAS_SelectedRow),"EMPTY","READY")
                                          Subtitle: =varAPAS_DossierTab
                                          Title: ="Equipment dossier"
                                          Width: =Parent.Width
                                    - conAPAS_Actions:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.SetByContainer
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          FillPortions: =0
                                          Height: |
                                            =56
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          PaddingBottom: =12
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                          PaddingTop: =4
                                          Width: =Parent.Width
                                        Children:
                                          - cmpAPAS_OpenWorkspace_1:
                                              Control: CanvasComponent
                                              ComponentName: cmp_AP_ActionButtonPro
                                              Properties:
                                                AccessibleLabel: =
                                                BusyText: ="Opening..."
                                                Height: =32
                                                IconKey: ="Open"
                                                IsBusy: =false
                                                IsEnabled: =false
                                                OnSelect: =Set(varAPAS_LastEvent,"OPEN_PRESERVATION_WORKSPACE:"&Coalesce(varAPAS_SelectedAsset.TagNumber,""))
                                                ShowIcon: =
                                                Text: ="Open Workspace"
                                                Tone: ="PRIMARY"
                                                Width: =150
                                          - cmpAPAS_ClearFilters_1:
                                              Control: CanvasComponent
                                              ComponentName: cmp_AP_ActionButtonPro
                                              Properties:
                                                AccessibleLabel: =
                                                BusyText: =
                                                Height: =32
                                                IconKey: ="Clear"
                                                IsBusy: =varAPAS_DossierBusy
                                                IsEnabled: =!IsBlank(varAPAS_SearchText) && !varAPAS_DossierBusy
                                                OnSelect: |-
                                                  =Set(varAPAS_SearchText,"");
                                                  Set(varAPAS_LastEvent,"CLEAR_FILTERS")
                                                ShowIcon: =
                                                Text: ="Clear search"
                                                Tone: ="SECONDARY"
                                                Width: =120
      - btnAPAS_LoadAssetPage_1:
          Control: Classic/Button@2.2.0
          Properties:
            Height: =1
            OnSelect: |-
              =If(
                  !varAPAS_DossierBusy && !IsBlank(Trim(Coalesce(gblAP_SelectedProjectCode,""))),
                  Set(varAPAS_DossierBusy,true);
                  Set(varAPAS_DossierBusyLabel,"Loading assets...");
                  IfError(
                      Set(
                          varAPAS_AssetPageResponse,
                          AssetPlan_GetAlepAssetsPaged.Run(
                              Value(gblAP_SelectedProjectCode),
                              Coalesce(varAPAS_SelectedFamilyKey,""),
                              Coalesce(varAPAS_SearchText,""),
                              Coalesce(ddAPAS_FilterEquipmentType_1.Selected.Value,""),
                              Coalesce(ddAPAS_FilterCommodity_1.Selected.Value,""),
                              Coalesce(varAPAS_AssetPageNumber,1),
                              Coalesce(varAPAS_AssetPageSize,50)
                          )
                      );
                      Set(varAPAS_AssetPageJson,Coalesce(Text(varAPAS_AssetPageResponse.resultjson),"[]"));
                      Set(varAPAS_AssetPageJson,Trim(Substitute(Substitute(varAPAS_AssetPageJson,Char(13),""),Char(10),"")));
                      If(StartsWith(varAPAS_AssetPageJson,Char(34)),Set(varAPAS_AssetPageJson,Substitute(Mid(varAPAS_AssetPageJson,2,Len(varAPAS_AssetPageJson)-2),Char(92)&Char(34),Char(34))));
                      ClearCollect(
                          colAPAS_AssetPage,
                          ForAll(
                              Table(ParseJSON(varAPAS_AssetPageJson)),
                              With(
                                  {r:ThisRecord.Value},
                                  {
                                      TagNumber:Coalesce(Text(r.TagNumber),""),
                                      EquipmentId:Coalesce(Text(r.EquipmentId),""),
                                      EquipmentDescription:Coalesce(Text(r.EquipmentDescription),""),
                                      Discipline:Coalesce(Text(r.Discipline),""),
                                      EquipmentType:Coalesce(Text(r.EquipmentType),""),
                                      CommodityCode:Coalesce(Text(r.CommodityCode),""),
                                      RevisionNumber:IfError(Value(r.RevisionNumber),Blank()),
                                      Quantity:IfError(Value(r.Quantity),Blank()),
                                      FamilyKey:Coalesce(Text(r.FamilyKey),""),
                                      FamilyName:Coalesce(Text(r.FamilyName),""),
                                      FamilyParentKey:Coalesce(Text(r.FamilyParentKey),""),
                                      FamilyDepthFromRoot:IfError(Value(r.FamilyDepthFromRoot),0),
                                      FamilyHierarchySortPath:Coalesce(Text(r.FamilyHierarchySortPath),""),
                                      EffectiveEquipmentTypeKey:Coalesce(Text(r.EffectiveEquipmentTypeKey),""),
                                      EffectiveEquipmentTypeName:Coalesce(Text(r.EffectiveEquipmentTypeName),""),
                                      FamilyResolutionState:Coalesce(Text(r.FamilyResolutionState),""),
                                      ReconciliationStatus:"",
                                      HcsResolutionStatus:"",
                                      ReconciliationCoverageStatus:""
                                  }
                              )
                          )
                      );
                      Set(varAPAS_DossierBusy,false);
                      Set(varAPAS_DossierBusyLabel,"");
                      Set(varAPAS_LastEvent,"ASSET_PAGE_READY"),
                      Set(varAPAS_DossierBusy,false);
                      Set(varAPAS_DossierBusyLabel,"");
                      Set(varAPAS_LastEvent,"ASSET_PAGE_ERROR")
                  )
              )
      - btnAPAS_LoadProjectData_1:
          Control: Classic/Button@2.2.0
          Properties:
            Height: =1
            OnSelect: |
              =Set(gblAP_ShowCredits, false);

              Set(varAPAS_TechnicalDataLoadedProject,"");

              Set(varAPAS_TechnicalDataLoadedTag,"");

              Set(varAPAS_TechnicalDataLoadState,"IDLE");

              Set(varAPAS_IllustrationModalOpen,false);

              Set(gblAP_ActiveView,"Assets");

              Set(varAPAS_DossierTab,"Overview");

              Set(varAPAS_LastEvent,"PRODUCTIVE_BINDING_LOADING");

              Set(varAPAS_IsBusy,true);

              Set(varAPAS_DossierBusy,false);

              Set(varAPAS_DossierBusyLabel,"");

              Set(varAPAS_TechnicalLoadRequested,false);

              Set(varAPAS_SearchText,"");

              Reset(txtAPAS_Search_1);

              Reset(ddAPAS_FilterEquipmentType_1);

              Reset(ddAPAS_FilterReconStatus_1);

              Reset(ddAPAS_FilterHcsState_1);

              Reset(ddAPAS_FilterCommodity_1);

              Set(varAPAS_SortKey,"TAG");

              Set(varAPAS_SortDirection,"ASC");

              Set(varAPAS_SummaryOk,false);

              Set(varAPAS_ReconciliationOk,false);

              Set(varAPAS_SummaryReadState,"UNAVAILABLE");

              Set(varAPAS_FreshnessStatus,"UNAVAILABLE");

              Set(varAPAS_LastSuccessfulRunId,Blank());

              Clear(colAPAS_Summary);

              Clear(colAPAS_Reconciliation);

              Clear(colAPAS_AssetsView);
              Clear(colAPAS_AssetPage);
              Set(varAPAS_AssetPageNumber,1);
              Set(varAPAS_AssetPageSize,50);

              If(

                  IsBlank(Trim(Coalesce(gblAP_SelectedProjectCode,""))),

                  Set(varAPAS_SelectedRow,"");

                  Set(varAPAS_SelectedAsset,Blank());

                  Set(varAPAS_LastEvent,"NO_PROJECT");

                  Set(gblAP_AlepLoadStatus,"IDLE");

                  Set(gblAP_AlepLoadedProjectCode,"");

                  Clear(colAP_AlepRaw);

                  Set(varAPAS_IsBusy,false),

                  Set(gblAP_AlepLoadStatus,"LOADING");

                  Set(gblAP_AlepLoadMessage,"Loading ALEP equipment data...");

                  Set(gblAP_AlepLoadErrorDetail,"");

                  IfError(

                      Set(

                          varAP_AlepFlowResult,

                          'AssetPlan_GetAlepEquipmentByProject'.Run(

                              Value(gblAP_SelectedProjectCode)

                          )

                      );

                      Set(

                          varAP_AlepJson,

                          Coalesce(Text(varAP_AlepFlowResult.resultjson),"[]")

                      );

                      Set(varAP_AlepJson,Substitute(varAP_AlepJson,Char(13),""));

                      Set(varAP_AlepJson,Substitute(varAP_AlepJson,Char(10),""));

                      Set(varAP_AlepJson,Trim(varAP_AlepJson));

                      If(

                          StartsWith(varAP_AlepJson,Char(34)),

                          Set(

                              varAP_AlepJson,

                              Substitute(

                                  Mid(varAP_AlepJson,2,Len(varAP_AlepJson)-2),

                                  Char(92) & Char(34),

                                  Char(34)

                              )

                          );

                          Set(varAP_AlepJson,Trim(varAP_AlepJson))

                      );

                      ClearCollect(

                          colAP_AlepRaw,

                          ForAll(

                              Table(ParseJSON(varAP_AlepJson)),

                              With(

                                  {r:ThisRecord.Value},

                                  {

                                      ProjectCode:Coalesce(Text(r.PROJECT),""),

                                      TagNumber:Coalesce(Text(r.TAG_NUMBER),""),

                                      EquipmentId:Coalesce(Text(r.EQUIPMENT_ID),""),

                                      EquipmentDescription:Coalesce(Text(r.EQUIPMENT_DESCRIPTION),""),

                                      Discipline:Coalesce(Text(r.DISCIPLINE),""),

                                      EquipmentType:Coalesce(Text(r.EQUIPMENT_TYPE),""),

                                      ClientUnit:Coalesce(Text(r.CLIENT_UNIT),""),

                                      TRUnit:Coalesce(Text(r.TR_UNIT),""),

                                      RevisionNumber:IfError(Value(r.REVISION_NUMBER),Blank()),

                                      Quantity:IfError(Value(r.QUANTITY),Blank()),

                                      CommodityCode:Coalesce(Text(r.COMMODITY_CODE),""),

                                      CommodityCodeFinal:Coalesce(Text(r.COMMODITY_CODE_FINAL),""),

                                      RevisionCode:Coalesce(Text(r.REVISION_CODE),""),

                                      ReqPONumber:Coalesce(Text(r.REQ_PO_NUMBER),""),

                                      PackageNumber:Coalesce(Text(r.PACKAGE_NUMBER),""),

                                      TRProcessUnit:Coalesce(Text(r.TR_PROCESS_UNIT),""),

                                      ClientProcessUnit:Coalesce(Text(r.CLIENT_PROCESS_UNIT),""),

                                      OperationalSystem:Coalesce(Text(r.OPERATIONAL_SYSTEM),""),

                                      SupplyByOthers:Coalesce(Text(r.SUPPLY_BY_OTHERS),""),

                                      Module:Coalesce(Text(r.MODULE),""),

                                      Yard:Coalesce(Text(r.YARD),""),

                                      ECTag:Coalesce(Text(r.EC_TAG),""),

                                      CEConformity:Coalesce(Text(r.CE_CONFORMITY),""),

                                      AlepProjectCode:Coalesce(Text(r.ALEP_PROJECT_CODE),""),

                                      ProjectDescription:Coalesce(Text(r.PROJECT_DESCRIPTION),""),

                                      CanonicalEquipmentTypeKey:Coalesce(Text(r.CanonicalEquipmentTypeKey),""),

                                      CanonicalEquipmentTypeName:Coalesce(Text(r.CanonicalEquipmentTypeName),""),

                                      CanonicalizationState:Coalesce(Text(r.CanonicalizationState),""),

                                      FamilyKey:Coalesce(Text(r.FamilyKey),""),

                                      FamilyName:Coalesce(Text(r.FamilyName),""),

                                      FamilyParentKey:Coalesce(Text(r.FamilyParentKey),""),

                                      FamilyDepthFromRoot:IfError(Value(r.FamilyDepthFromRoot),Blank()),

                                      FamilyHierarchySortPath:Coalesce(Text(r.FamilyHierarchySortPath),""),

                                      FamilyResolutionState:Coalesce(Text(r.FamilyResolutionState),""),

                                      EffectiveEquipmentTypeKey:Coalesce(Text(r.EffectiveEquipmentTypeKey),""),

                                      EffectiveEquipmentTypeName:Coalesce(Text(r.EffectiveEquipmentTypeName),"")

                                  }

                              )

                          )

                      );

                      Set(gblAP_AlepSourceRowCount,CountRows(colAP_AlepRaw));

                      Set(gblAP_AlepLoadedProjectCode,gblAP_SelectedProjectCode);

                      If(

                          gblAP_AlepSourceRowCount=0,

                          Set(gblAP_AlepLoadStatus,"EMPTY");

                          Set(gblAP_AlepLoadMessage,"No ALEP equipment data found for this project."),

                          Set(gblAP_AlepLoadStatus,"READY");

                          Set(gblAP_AlepLoadMessage,Text(gblAP_AlepSourceRowCount) & " ALEP equipment row(s) loaded")

                      ),

                      Set(gblAP_AlepLoadStatus,"ERROR");

                      Set(gblAP_AlepLoadMessage,"Unable to load ALEP equipment data.");

                      Set(gblAP_AlepLoadErrorDetail,Coalesce(FirstError.Message,"Unknown ALEP source error."));

                      Clear(colAP_AlepRaw);

                      Set(gblAP_AlepSourceRowCount,0);

                      Set(gblAP_AlepLoadedProjectCode,"")

                  );

                  IfError(

                      Set(

                          varAPAS_BundleRaw,

                          AssetPlan_Assets_GetProjectBundle.Run(

                              Value(gblAP_SelectedProjectCode)

                          )

                      );

                      Set(

                          varAPAS_SummaryOk,

                          Lower(Trim(Text(varAPAS_BundleRaw.summaryok)))="true"

                      );

                      Set(

                          varAPAS_ReconciliationOk,

                          Lower(Trim(Text(varAPAS_BundleRaw.reconciliationok)))="true"

                      );

                      Set(

                          varAPAS_SummaryJson,

                          Coalesce(Text(varAPAS_BundleRaw.summaryjson),"[]")

                      );

                      Set(

                          varAPAS_ReconciliationJson,

                          Coalesce(Text(varAPAS_BundleRaw.reconciliationjson),"[]")

                      );

                      Set(

                          varAPAS_ReconciliationCount,

                          IfError(Value(Text(varAPAS_BundleRaw.reconciliationcount)),-1)

                      );

                      ClearCollect(

                          colAPAS_Summary,

                          ForAll(

                              Table(ParseJSON(varAPAS_SummaryJson)),

                              {

                                  ProjectCode:Text(ThisRecord.Value.ProjectCode),

                                  ReconciliationReadState:Text(ThisRecord.Value.ReconciliationReadState),

                                  DecisionReadState:Text(ThisRecord.Value.DecisionReadState),

                                  LastSuccessfulRunId:Text(ThisRecord.Value.LastSuccessfulRunId),

                                  GeneratedAtUtc:Text(ThisRecord.Value.GeneratedAtUtc),

                                  AlepCapturedAtUtc:Text(ThisRecord.Value.AlepCapturedAtUtc),

                                  HcsCapturedAtUtc:Text(ThisRecord.Value.HcsCapturedAtUtc),

                                  LastAttemptStatus:Text(ThisRecord.Value.LastAttemptStatus),

                                  LastFailureCode:Text(ThisRecord.Value.LastFailureCode),

                                  FreshnessStatus:Text(ThisRecord.Value.FreshnessStatus),

                                  FreshnessPolicyStatus:Text(ThisRecord.Value.FreshnessPolicyStatus),

                                  SnapshotEquipmentCount:IfError(Value(Text(ThisRecord.Value.SnapshotEquipmentCount)),Blank()),

                                  HcsResolvedCount:IfError(Value(Text(ThisRecord.Value.HcsResolvedCount)),Blank()),

                                  HcsNotResolvedCount:IfError(Value(Text(ThisRecord.Value.HcsNotResolvedCount)),Blank()),

                                  PreservationRegisteredCount:IfError(Value(Text(ThisRecord.Value.PreservationRegisteredCount)),Blank()),

                                  PreservationDataIssueCount:IfError(Value(Text(ThisRecord.Value.PreservationDataIssueCount)),Blank()),

                                  SourceDifferenceCount:IfError(Value(Text(ThisRecord.Value.SourceDifferenceCount)),Blank())

                              }

                          )

                      );

                      Set(varAPAS_SummaryRecord,First(colAPAS_Summary));

                      Set(

                          varAPAS_SummaryReadState,

                          Coalesce(varAPAS_SummaryRecord.ReconciliationReadState,"UNAVAILABLE")

                      );

                      Set(

                          varAPAS_FreshnessStatus,

                          Coalesce(varAPAS_SummaryRecord.FreshnessStatus,"UNAVAILABLE")

                      );

                      Set(

                          varAPAS_LastSuccessfulRunId,

                          varAPAS_SummaryRecord.LastSuccessfulRunId

                      );

                      ClearCollect(

                          colAPAS_Reconciliation,

                          ForAll(

                              Table(ParseJSON(varAPAS_ReconciliationJson)),

                              {

                                  ProjectCode:Text(ThisRecord.Value.ProjectCode),

                                  TagNumber:Text(ThisRecord.Value.TagNumber),

                                  EquipmentType:Coalesce(Text(ThisRecord.Value.EquipmentType),""),

                                  CommodityCode:Coalesce(Text(ThisRecord.Value.CommodityCode),""),

                                  ReconciliationCoverageStatus:Text(ThisRecord.Value.ReconciliationCoverageStatus),

                                  ReconciliationStatus:Text(ThisRecord.Value.ReconciliationStatus),

                                  DataIssueCode:Text(ThisRecord.Value.DataIssueCode),

                                  HcsResolutionStatus:Text(ThisRecord.Value.HcsResolutionStatus),

                                  HcsElementId:Text(ThisRecord.Value.HcsElementId),

                                  HcsElementCode:Text(ThisRecord.Value.HcsElementCode),

                                  HcsRepresentation:Text(ThisRecord.Value.HcsRepresentation),

                                  PreservationTypeCode:Text(ThisRecord.Value.PreservationTypeCode),

                                  PreservationTypeName:Text(ThisRecord.Value.PreservationTypeName),

                                  DecisionStatus:Text(ThisRecord.Value.DecisionStatus),

                                  SelectedPreservationTypeCode:Text(ThisRecord.Value.SelectedPreservationTypeCode),

                                  SelectedPreservationTypeName:Text(ThisRecord.Value.SelectedPreservationTypeName),

                                  SuggestedPreservationTypeCode:Text(ThisRecord.Value.SuggestedPreservationTypeCode),

                                  PublishedRunId:Text(ThisRecord.Value.PublishedRunId),

                                  GeneratedAtUtc:Text(ThisRecord.Value.GeneratedAtUtc)

                              }

                          )

                      ),

                      Set(varAPAS_SummaryOk,false);

                      Set(varAPAS_ReconciliationOk,false);

                      Set(varAPAS_SummaryReadState,"UNAVAILABLE");

                      Set(varAPAS_FreshnessStatus,"UNAVAILABLE");

                      Set(varAPAS_LastEvent,"READ_BUNDLE_ERROR")

                  );

                  If(

                      !varAPAS_ReconciliationOk ||

                      Upper(Coalesce(varAPAS_SummaryReadState,"UNAVAILABLE"))<>"READY",

                      ClearCollect(

                          colAPAS_AssetsView,

                          ForAll(

                              Filter(

                                  colAP_AlepRaw,

                                  Text(ProjectCode)=Text(gblAP_SelectedProjectCode) &&

                                  !IsBlank(Trim(Text(TagNumber)))

                              ) As alep,

                              {

                                  Order:10,

                                  ProjectCode:Text(alep.ProjectCode),

                                  TagNumber:Text(alep.TagNumber),

                                  EquipmentType:Coalesce(Text(alep.EquipmentType),""),

                                  CommodityCode:Coalesce(Text(alep.CommodityCode),""),

                                  CanonicalEquipmentTypeKey:Coalesce(Text(alep.CanonicalEquipmentTypeKey),""),

                                  CanonicalEquipmentTypeName:Coalesce(Text(alep.CanonicalEquipmentTypeName),""),

                                  CanonicalizationState:Coalesce(Text(alep.CanonicalizationState),""),

                                  FamilyKey:Coalesce(Text(alep.FamilyKey),""),

                                  FamilyName:Coalesce(Text(alep.FamilyName),""),

                                  FamilyParentKey:Coalesce(Text(alep.FamilyParentKey),""),

                                  FamilyDepthFromRoot:alep.FamilyDepthFromRoot,

                                  FamilyHierarchySortPath:Coalesce(Text(alep.FamilyHierarchySortPath),""),

                                  FamilyResolutionState:Coalesce(Text(alep.FamilyResolutionState),""),

                                  EffectiveEquipmentTypeKey:Coalesce(Text(alep.EffectiveEquipmentTypeKey),""),

                                  EffectiveEquipmentTypeName:Coalesce(Text(alep.EffectiveEquipmentTypeName),""),

                                  ReconciliationCoverageStatus:"UNAVAILABLE",

                                  ReconciliationStatus:Blank(),

                                  DataIssueCode:Blank(),

                                  HcsResolutionStatus:Blank(),

                                  HcsElementId:Blank(),

                                  HcsElementCode:Blank(),

                                  HcsRepresentation:Blank(),

                                  PreservationTypeCode:Blank(),

                                  PreservationTypeName:Blank(),

                                  DecisionStatus:Blank(),

                                  SelectedPreservationTypeCode:Blank(),

                                  SelectedPreservationTypeName:Blank(),

                                  SuggestedPreservationTypeCode:Blank(),

                                  PublishedRunId:Blank(),

                                  ReconciliationGeneratedAtUtc:Blank()

                              }

                          )

                      ),

                      ClearCollect(

                          colAPAS_AssetsView,

                          ForAll(

                              Filter(

                                  colAP_AlepRaw,

                                  Text(ProjectCode)=Text(gblAP_SelectedProjectCode) &&

                                  !IsBlank(Trim(Text(TagNumber)))

                              ) As alep,

                              With(

                                  {

                                      rec:LookUp(

                                          colAPAS_Reconciliation As rr,

                                          rr.ProjectCode=Text(gblAP_SelectedProjectCode) &&

                                          rr.TagNumber=Text(alep.TagNumber)

                                      )

                                  },

                                  With(

                                      {

                                          coverage:If(

                                              !IsBlank(rec.TagNumber),

                                              Coalesce(rec.ReconciliationCoverageStatus,"AVAILABLE"),

                                              If(

                                                  !IsBlank(varAPAS_LastSuccessfulRunId),

                                                  "NOT_IN_LAST_SUCCESSFUL_SNAPSHOT",

                                                  "UNAVAILABLE"

                                              )

                                          )

                                      },

                                      {

                                          Order:10,

                                          ProjectCode:Text(alep.ProjectCode),

                                          TagNumber:Text(alep.TagNumber),

                                          EquipmentType:Coalesce(Text(alep.EquipmentType),""),

                                          CommodityCode:Coalesce(Text(alep.CommodityCode),""),

                                          CanonicalEquipmentTypeKey:Coalesce(Text(alep.CanonicalEquipmentTypeKey),""),

                                          CanonicalEquipmentTypeName:Coalesce(Text(alep.CanonicalEquipmentTypeName),""),

                                          CanonicalizationState:Coalesce(Text(alep.CanonicalizationState),""),

                                          FamilyKey:Coalesce(Text(alep.FamilyKey),""),

                                          FamilyName:Coalesce(Text(alep.FamilyName),""),

                                          FamilyParentKey:Coalesce(Text(alep.FamilyParentKey),""),

                                          FamilyDepthFromRoot:alep.FamilyDepthFromRoot,

                                          FamilyHierarchySortPath:Coalesce(Text(alep.FamilyHierarchySortPath),""),

                                          FamilyResolutionState:Coalesce(Text(alep.FamilyResolutionState),""),

                                          EffectiveEquipmentTypeKey:Coalesce(Text(alep.EffectiveEquipmentTypeKey),""),

                                          EffectiveEquipmentTypeName:Coalesce(Text(alep.EffectiveEquipmentTypeName),""),

                                          ReconciliationCoverageStatus:coverage,

                                          ReconciliationStatus:If(coverage="AVAILABLE",rec.ReconciliationStatus,Blank()),

                                          DataIssueCode:If(coverage="AVAILABLE",rec.DataIssueCode,Blank()),

                                          HcsResolutionStatus:If(coverage="AVAILABLE",rec.HcsResolutionStatus,Blank()),

                                          HcsElementId:If(coverage="AVAILABLE",rec.HcsElementId,Blank()),

                                          HcsElementCode:If(coverage="AVAILABLE",rec.HcsElementCode,Blank()),

                                          HcsRepresentation:If(coverage="AVAILABLE",rec.HcsRepresentation,Blank()),

                                          PreservationTypeCode:If(coverage="AVAILABLE",rec.PreservationTypeCode,Blank()),

                                          PreservationTypeName:If(coverage="AVAILABLE",rec.PreservationTypeName,Blank()),

                                          DecisionStatus:If(coverage="AVAILABLE",rec.DecisionStatus,Blank()),

                                          SelectedPreservationTypeCode:If(coverage="AVAILABLE",rec.SelectedPreservationTypeCode,Blank()),

                                          SelectedPreservationTypeName:If(coverage="AVAILABLE",rec.SelectedPreservationTypeName,Blank()),

                                          SuggestedPreservationTypeCode:If(coverage="AVAILABLE",rec.SuggestedPreservationTypeCode,Blank()),

                                          PublishedRunId:If(coverage="AVAILABLE",rec.PublishedRunId,Blank()),

                                          ReconciliationGeneratedAtUtc:If(coverage="AVAILABLE",rec.GeneratedAtUtc,Blank())

                                      }

                                  )

                              )

                          )

                      )

                  );

                  ClearCollect(
                      colAPAS_FamilyTree,
                      AddColumns(
                          GroupBy(
                              Filter(
                                  colAPAS_AssetsView,
                                  !IsBlank(Trim(Coalesce(FamilyKey,"")))
                              ),
                              FamilyKey,
                              FamilyRows
                          ),
                          FamilyName,
                          Coalesce(First(FamilyRows).FamilyName,""),
                          FamilyParentKey,
                          Coalesce(First(FamilyRows).FamilyParentKey,""),
                          FamilyDepthFromRoot,
                          First(FamilyRows).FamilyDepthFromRoot,
                          FamilyHierarchySortPath,
                          Coalesce(First(FamilyRows).FamilyHierarchySortPath,""),
                          AssetCount,
                          CountRows(FamilyRows),
                          EquipmentTypeCount,
                          CountRows(
                              Distinct(
                                  Filter(
                                      FamilyRows,
                                      !IsBlank(Trim(Coalesce(EffectiveEquipmentTypeKey,"")))
                                  ),
                                  EffectiveEquipmentTypeKey
                              )
                          ),
                          HasChildren,
                          CountRows(
                              Filter(
                                  colAPAS_AssetsView,
                                  FamilyParentKey=FamilyKey
                              )
                          )>0
                      )
                  );

                  Collect(
                      colAPAS_FamilyTree,
                      {
                          FamilyKey:"ALL_ENGINEERED_EQUIPMENT",
                          FamilyName:"All Engineered Equipment",
                          FamilyParentKey:"",
                          FamilyDepthFromRoot:0,
                          FamilyHierarchySortPath:"0000000000",
                          AssetCount:CountRows(colAPAS_AssetsView),
                          EquipmentTypeCount:CountRows(Distinct(colAPAS_AssetsView,EffectiveEquipmentTypeKey)),
                          HasChildren:CountRows(Filter(colAPAS_FamilyTree,FamilyKey<>"ALL_ENGINEERED_EQUIPMENT"))>0
                      }
                  );

                  Set(varAPAS_SelectedFamilyKey,Blank());

                  Set(
                      varAPAS_ExpandedFamilyKeys,
                      Concat(
                          Filter(colAPAS_FamilyTree,FamilyKey="ALL_ENGINEERED_EQUIPMENT"),
                          Upper(FamilyKey),
                          "|"
                      )
                  );

                  Set(varAPAS_SelectedRow,Coalesce(First(colAPAS_AssetsView).TagNumber,""));

                  Set(varAPAS_SelectedAsset,First(colAPAS_AssetsView));

                  Set(varAPAS_SelectedFamilyKey,Blank());

                  Set(varAPAS_AssetPageNumber,1);

                  Select(btnAPAS_LoadAssetPage_1);

                  Set(varAPAS_IsBusy,false);

                  If(

                      gblAP_AlepLoadStatus="ERROR",

                      Set(varAPAS_LastEvent,"ALEP_READ_ERROR"),

                      gblAP_AlepLoadStatus="EMPTY",

                      Set(varAPAS_LastEvent,"ALEP_EMPTY"),

                      Set(varAPAS_LastEvent,"PRODUCTIVE_BINDING_READY")

                  )

              );
            Text: =""
            Visible: =false
            Width: =1
      - btnAPAS_TechnicalLoad_Alep_1:
          Control: Classic/Button@2.2.0
          Properties:
            Height: =1
            OnSelect: |-
              =If(
                  IsBlank(varAPAS_SelectedAsset) ||
                  IsBlank(Trim(Coalesce(varAPAS_SelectedAsset.TagNumber,""))) ||
                  IsBlank(Trim(Coalesce(gblAP_SelectedProjectCode,""))),
                  Set(varAPAS_TechnicalDataLoadState,"EMPTY");
                  Set(varAPAS_TechnicalDataEmptyReason,"NO_SELECTION");
                  Set(varAPAS_LastEvent,"TECHNICAL_DATA_EMPTY:NO_SELECTION");
                  Set(varAPAS_DossierBusy,false);
                  Set(varAPAS_DossierBusyLabel,""),
                  Set(
                      varAPAS_TechnicalContextKey,
                      Trim(Coalesce(varAPAS_SelectedAsset.EquipmentType,"")) & " | " &
                      Trim(Coalesce(varAPAS_SelectedAsset.CommodityCode,""))
                  );
                  IfError(
                      Set(
                          varAPAS_SelectedTechnicalResponse,
                          AssetPlan_Assets_GetSelectedTechnicalData.Run(
                              Text(gblAP_SelectedProjectCode),
                              Text(varAPAS_SelectedAsset.TagNumber)
                          )
                      );
                      Set(varAPAS_SelectedTechnicalOk,Lower(Trim(Text(varAPAS_SelectedTechnicalResponse.ok)))="true");
                      Set(varAPAS_SelectedTechnicalJson,Coalesce(Text(varAPAS_SelectedTechnicalResponse.resultjson),"[]"));
                      Set(varAPAS_SelectedTechnicalCount,IfError(Value(Text(varAPAS_SelectedTechnicalResponse.count)),0));
                      Set(varAPAS_TechnicalDataErrorCode,Coalesce(Text(varAPAS_SelectedTechnicalResponse.errorcode),""));
                      Set(varAPAS_TechnicalDataError,Coalesce(Text(varAPAS_SelectedTechnicalResponse.errormessage),""));
                      If(
                          varAPAS_SelectedTechnicalOk,
                          ClearCollect(
                              colAPAS_SelectedTechnicalRaw,
                              ForAll(
                                  Table(ParseJSON(varAPAS_SelectedTechnicalJson)),
                                  {
                                      ProjectCode:Text(ThisRecord.Value.PROJECT),
                                      TagNumber:Text(ThisRecord.Value.TAG_NUMBER),
                                      EquipmentType:Text(ThisRecord.Value.EQUIPMENT_TYPE),
                                      CommodityCode:Text(ThisRecord.Value.COMMODITY_CODE),
                                      ContextKey:Text(ThisRecord.Value.CONTEXT_KEY),
                                      SourceColumn:Text(ThisRecord.Value.SOURCE_COLUMN),
                                      ColumnOrder:IfError(Value(Text(ThisRecord.Value.COLUMN_ORDER)),999),
                                      RawValue:Text(ThisRecord.Value.RAW_VALUE)
                                  }
                              )
                          );
                          If(
                              CountRows(colAPAS_SelectedTechnicalRaw)=0,
                              Set(varAPAS_TechnicalDataLoadState,"EMPTY");
                              Set(varAPAS_TechnicalDataEmptyReason,"NO_RAW_VALUES");
                              Set(varAPAS_TechnicalDataLoadedProject,Text(gblAP_SelectedProjectCode));
                              Set(varAPAS_TechnicalDataLoadedTag,Text(varAPAS_SelectedAsset.TagNumber));
                              Set(varAPAS_LastEvent,"TECHNICAL_DATA_EMPTY:NO_RAW_VALUES");
                              Set(varAPAS_DossierBusy,false);
                              Set(varAPAS_DossierBusyLabel,""),
                              Set(
                                  varAPAS_DossierBusyLabel,
                                  "Reading contextual mappings · "&Coalesce(varAPAS_SelectedAsset.TagNumber,"selected equipment")
                              );
                              Select(btnAPAS_TechnicalLoad_Mappings_1)
                          ),
                          Set(varAPAS_TechnicalDataLoadState,"ERROR");
                          Set(varAPAS_TechnicalDataErrorCode,Coalesce(varAPAS_TechnicalDataErrorCode,"ASSETS_TECHNICAL_DATA_READ_FAILED"));
                          Set(varAPAS_TechnicalDataError,Coalesce(varAPAS_TechnicalDataError,"Technical Data read returned an error."));
                          Set(varAPAS_LastEvent,"TECHNICAL_DATA_ERROR:"&Coalesce(varAPAS_TechnicalDataErrorCode,"READ_FAILED"));
                          Set(varAPAS_DossierBusy,false);
                          Set(varAPAS_DossierBusyLabel,"")
                      ),
                      Set(varAPAS_SelectedTechnicalOk,false);
                      Set(varAPAS_TechnicalDataLoadState,"ERROR");
                      Set(varAPAS_TechnicalDataErrorCode,"ASSETS_TECHNICAL_DATA_TRANSPORT_FAILED");
                      Set(varAPAS_TechnicalDataError,Coalesce(FirstError.Message,"Unable to read selected ALEP technical values."));
                      Set(varAPAS_LastEvent,"TECHNICAL_DATA_ERROR:ASSETS_TECHNICAL_DATA_TRANSPORT_FAILED");
                      Set(varAPAS_DossierBusy,false);
                      Set(varAPAS_DossierBusyLabel,"")
                  )
              )
            Text: =""
            Visible: =false
            Width: =1
      - btnAPAS_TechnicalLoad_Mappings_1:
          Control: Classic/Button@2.2.0
          Properties:
            Height: =1
            OnSelect: |-
              =IfError(
                  Set(
                      varAPAS_MappingResponse,
                      AssetPlan_GetAlepFieldMappings.Run(
                          Text(gblAP_SelectedProjectCode),
                          varAPAS_TechnicalContextKey
                      )
                  );
                  Set(varAPAS_MappingOk,Lower(Trim(Text(varAPAS_MappingResponse.ok)))="true");
                  Set(varAPAS_MappingJson,Coalesce(Text(varAPAS_MappingResponse.resultjson),"[]"));
                  If(
                      varAPAS_MappingOk,
                      ClearCollect(
                          colAPAS_SelectedTechnicalMappings,
                          ForAll(
                              Table(ParseJSON(varAPAS_MappingJson)),
                              {
                                  MappingId:IfError(Value(Text(ThisRecord.Value.MappingId)),Blank()),
                                  ProjectCode:Text(ThisRecord.Value.ProjectCode),
                                  ContextKey:Text(ThisRecord.Value.ContextKey),
                                  SourceColumn:Text(ThisRecord.Value.SourceColumn),
                                  AttributeKey:Text(ThisRecord.Value.AttributeKey),
                                  MappingKey:Text(ThisRecord.Value.MappingKey)
                              }
                          )
                      );
                      If(
                          CountRows(colAPAS_SelectedTechnicalMappings)=0,
                          Set(varAPAS_TechnicalDataLoadState,"EMPTY");
                          Set(varAPAS_TechnicalDataEmptyReason,"NO_CONTEXTUAL_MAPPINGS");
                          Set(varAPAS_TechnicalDataLoadedProject,Text(gblAP_SelectedProjectCode));
                          Set(varAPAS_TechnicalDataLoadedTag,Text(varAPAS_SelectedAsset.TagNumber));
                          Set(varAPAS_LastEvent,"TECHNICAL_DATA_EMPTY:NO_CONTEXTUAL_MAPPINGS");
                          Set(varAPAS_DossierBusy,false);
                          Set(varAPAS_DossierBusyLabel,""),
                          If(
                              CountRows(colAPAS_TechnicalFieldsCatalog)=0,
                              Set(
                                  varAPAS_DossierBusyLabel,
                                  "Loading Technical Fields glossary · "&Coalesce(varAPAS_SelectedAsset.TagNumber,"selected equipment")
                              );
                              Select(btnAPAS_TechnicalLoad_Glossary_1),
                              Set(varAPAS_GlossaryOk,true);
                              Set(
                                  varAPAS_DossierBusyLabel,
                                  "Building governed Technical Data · "&Coalesce(varAPAS_SelectedAsset.TagNumber,"selected equipment")
                              );
                              Select(btnAPAS_TechnicalLoad_Build_1)
                          )
                      ),
                      Set(varAPAS_TechnicalDataLoadState,"ERROR");
                      Set(varAPAS_TechnicalDataErrorCode,Coalesce(Text(varAPAS_MappingResponse.errorcode),"MAPPING_READ_FAILED"));
                      Set(varAPAS_TechnicalDataError,Coalesce(Text(varAPAS_MappingResponse.errormessage),"Unable to read contextual mappings."));
                      Set(varAPAS_LastEvent,"TECHNICAL_DATA_ERROR:"&varAPAS_TechnicalDataErrorCode);
                      Set(varAPAS_DossierBusy,false);
                      Set(varAPAS_DossierBusyLabel,"")
                  ),
                  Set(varAPAS_MappingOk,false);
                  Set(varAPAS_TechnicalDataLoadState,"ERROR");
                  Set(varAPAS_TechnicalDataErrorCode,"MAPPING_TRANSPORT_FAILED");
                  Set(varAPAS_TechnicalDataError,Coalesce(FirstError.Message,"Unable to read contextual mappings."));
                  Set(varAPAS_LastEvent,"TECHNICAL_DATA_ERROR:MAPPING_TRANSPORT_FAILED");
                  Set(varAPAS_DossierBusy,false);
                  Set(varAPAS_DossierBusyLabel,"")
              )
            Text: =""
            Visible: =false
            Width: =1
      - btnAPAS_TechnicalLoad_Glossary_1:
          Control: Classic/Button@2.2.0
          Properties:
            Height: =1
            OnSelect: |-
              =IfError(
                  Set(
                      varAPAS_GlossaryResponse,
                      AssetPlan_TechnicalFields_GlossaryReadSearch.Run(
                          JSON({contractVersion:"1.0",mode:"BROWSE",maxResults:100},JSONFormat.Compact)
                      )
                  );
                  Set(varAPAS_GlossaryParsed,ParseJSON(Text(varAPAS_GlossaryResponse.resultjson)));
                  Set(varAPAS_GlossaryOk,Lower(Trim(Text(varAPAS_GlossaryParsed.ok)))="true");
                  If(
                      varAPAS_GlossaryOk,
                      ClearCollect(
                          colAPAS_TechnicalFieldsCatalog,
                          ForAll(
                              Table(varAPAS_GlossaryParsed.results),
                              {
                                  AttributeId:IfError(Value(Text(ThisRecord.Value.attributeId)),Blank()),
                                  AttributeKey:Text(ThisRecord.Value.attributeKey),
                                  DisplayName:Text(ThisRecord.Value.displayName),
                                  CategoryKey:Text(ThisRecord.Value.categoryKey),
                                  CategoryDisplayName:Text(ThisRecord.Value.categoryDisplayName),
                                  DataTypeCode:Text(ThisRecord.Value.dataTypeCode),
                                  PreservationRelevanceCode:Text(ThisRecord.Value.preservationRelevanceCode)
                              }
                          )
                      );
                      Set(
                          varAPAS_DossierBusyLabel,
                          "Building governed Technical Data · "&Coalesce(varAPAS_SelectedAsset.TagNumber,"selected equipment")
                      );
                      Select(btnAPAS_TechnicalLoad_Build_1),
                      Set(varAPAS_TechnicalDataLoadState,"ERROR");
                      Set(varAPAS_TechnicalDataErrorCode,"GLOSSARY_READ_FAILED");
                      Set(varAPAS_TechnicalDataError,"Technical Fields glossary returned an error.");
                      Set(varAPAS_LastEvent,"TECHNICAL_DATA_ERROR:GLOSSARY_READ_FAILED");
                      Set(varAPAS_DossierBusy,false);
                      Set(varAPAS_DossierBusyLabel,"")
                  ),
                  Set(varAPAS_GlossaryOk,false);
                  Set(varAPAS_TechnicalDataLoadState,"ERROR");
                  Set(varAPAS_TechnicalDataErrorCode,"GLOSSARY_TRANSPORT_FAILED");
                  Set(varAPAS_TechnicalDataError,Coalesce(FirstError.Message,"Unable to read Technical Fields glossary."));
                  Set(varAPAS_LastEvent,"TECHNICAL_DATA_ERROR:GLOSSARY_TRANSPORT_FAILED");
                  Set(varAPAS_DossierBusy,false);
                  Set(varAPAS_DossierBusyLabel,"")
              )
            Text: =""
            Visible: =false
            Width: =1
      - btnAPAS_TechnicalLoad_Build_1:
          Control: Classic/Button@2.2.0
          Properties:
            Height: =1
            OnSelect: |-
              =ClearCollect(
                  colAPAS_TechnicalDataRows,
                  ForAll(
                      colAPAS_SelectedTechnicalRaw As raw,
                      With(
                          {mapping:LookUp(colAPAS_SelectedTechnicalMappings As map,map.SourceColumn=raw.SourceColumn)},
                          With(
                              {field:LookUp(colAPAS_TechnicalFieldsCatalog As tf,tf.AttributeKey=mapping.AttributeKey)},
                              If(
                                  !IsBlank(mapping.AttributeKey) && !IsBlank(field.AttributeKey),
                                  {
                                      Order:raw.ColumnOrder,
                                      Key:field.AttributeKey,
                                      Label:field.DisplayName,
                                      ValueText:raw.RawValue,
                                      SupportingText:field.CategoryDisplayName & " · " & raw.SourceColumn,
                                      Tone:"NEUTRAL",
                                      IsInteractive:false
                                  }
                              )
                          )
                      )
                  )
              );
              If(
                  CountRows(colAPAS_TechnicalDataRows)>0,
                  Set(varAPAS_TechnicalDataLoadState,"READY");
                  Set(varAPAS_TechnicalDataEmptyReason,""),
                  Set(varAPAS_TechnicalDataLoadState,"EMPTY");
                  Set(varAPAS_TechnicalDataEmptyReason,"NO_GOVERNED_MATCHES")
              );
              Set(varAPAS_TechnicalDataLoadedProject,Text(gblAP_SelectedProjectCode));
              Set(varAPAS_TechnicalDataLoadedTag,Text(varAPAS_SelectedAsset.TagNumber));
              Set(
                  varAPAS_LastEvent,
                  "TECHNICAL_DATA_" & varAPAS_TechnicalDataLoadState &
                  If(!IsBlank(varAPAS_TechnicalDataEmptyReason),":" & varAPAS_TechnicalDataEmptyReason,"")
              );
              Set(varAPAS_DossierBusy,false);
              Set(varAPAS_DossierBusyLabel,"")
            Text: =""
            Visible: =false
            Width: =1
