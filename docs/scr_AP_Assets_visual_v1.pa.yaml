Screens:
  scr_AP_Assets:
    Properties:
      Fill: =ColorValue("#F6F9FC")
      LoadingSpinnerColor: =ColorValue("#18C9D2")
      OnVisible: |
        =Select(btnAPAS_LoadProjectData_1)
    Children:
      - conAPAS_Root_1:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            DropShadow: =DropShadow.None
            Fill: =ColorValue("#F6F9FC")
            Height: =App.Height
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =App.Width
          Children:
            - conAPAS_SidebarSlot_1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#071F3D")
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Vertical
                  Width: =If(gblAP_SidebarCollapsed,72,196)
                Children:
                  - cmpAPAS_Sidebar:
                      Control: CanvasComponent
                      ComponentName: cmp_AssetPlanSidebarPro
                      Properties:
                        ActiveKey: =gblAP_ActiveView
                        AppVersion: =gblAP_AppVersion
                        CollapsedGroups: =gblAP_SidebarCollapsedGroups
                        EnvironmentLabel: =gblAP_EnvironmentLabel
                        Fill: =ColorValue("#071F3D")
                        Height: =App.Height
                        IsCollapsed: =gblAP_SidebarCollapsed
                        NeedsAttentionCount: =Coalesce(gblAP_NeedsAttentionCount, 0)
                        OnNavigate: |-
                          =
                          Switch(
                              Lower(Text(p_key)),

                              "dashboard",
                                  Navigate(
                                      scr_AP_PreservationDashboard,
                                      ScreenTransition.None
                                  ),

                              "preservationplans",
                                  Navigate(
                                      scr_AP_PreservationPlans,
                                      ScreenTransition.None
                                  ),

                              "preservationrules",
                                  Navigate(
                                      scr_AP_PreservationRules,
                                      ScreenTransition.None
                                  ),


                              "documentumtemplate",
                                  Navigate(
                                      scr_AP_DocumentumTemplate,
                                      ScreenTransition.None
                                  ),




                              "documentintake",
                                  Navigate(
                                      scr_AP_DocumentumTemplate,
                                      ScreenTransition.None
                                  ),

                              "inspections",
                                  Notify(
                                      "Inspections todavía no está conectado.",
                                      NotificationType.Information
                                  ),

                              "assets",
                                  Notify(
                                      "Assets todavía no está conectado.",
                                      NotificationType.Information
                                  ),

                              "templatelibrary",
                                  Notify(
                                      "Template Library todavía no está conectado.",
                                      NotificationType.Information
                                  ),

                              "usersroles",
                                  Notify(
                                      "Users & Roles todavía no está conectado.",
                                      NotificationType.Information
                                  ),

                              "superadmin",
                                  Notify(
                                      "SuperAdmin todavía no está conectado.",
                                      NotificationType.Information
                                  ),

                              Notify(
                                  "Destino de navegación desconocido: " & Text(p_key),
                                  NotificationType.Warning
                              )
                          )
                        OnOpenCredits: |
                          =Set(gblAP_ShowCredits, true)
                        OnToggleCollapse: |-
                          =
                          Set(
                              gblAP_SidebarCollapsed,
                              !gblAP_SidebarCollapsed
                          )
                        OnToggleGroup: |-
                          =
                          With(
                              {
                                  token:
                                      "|" &
                                      Upper(Trim(Text(p_groupKey))) &
                                      "|"
                              },
                              Set(
                                  gblAP_SidebarCollapsedGroups,
                                  If(
                                      token in Upper(
                                          Coalesce(
                                              gblAP_SidebarCollapsedGroups,
                                              ""
                                          )
                                      ),
                                      Substitute(
                                          Upper(
                                              Coalesce(
                                                  gblAP_SidebarCollapsedGroups,
                                                  ""
                                              )
                                          ),
                                          token,
                                          ""
                                      ),
                                      Coalesce(
                                          gblAP_SidebarCollapsedGroups,
                                          ""
                                      ) & token
                                  )
                              )
                          )
                        ShowBrandPanel: =false
                        ShowSuperAdmin: =true
                        Width: |-
                          =

                          If(
                              gblAP_SidebarCollapsed,
                              72,
                              280
                          )
            - conAPAS_Workspace_1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#F6F9FC")
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Vertical
                  Width: =Parent.Width
                Children:
                  - cmpAPAS_GlobalTopBar_PI01:
                      Control: CanvasComponent
                      ComponentName: cmp_AP_GlobalTopBarPro
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        EnvironmentText: =""
                        Height: =48
                        IsProjectEnabled: =gblAP_BootStatus = "READY" && !varAPAS_IsBusy && !varAPAS_DossierBusy
                        IsProjectLoading: =varAPAS_IsBusy
                        OnProjectChange: |-
                          =Set(gblAP_SelectedProjectCode, cmpAPAS_GlobalTopBar_PI01.PendingProjectCode);
                          Set(gblAP_SelectedProjectName, cmpAPAS_GlobalTopBar_PI01.PendingProjectName);
                          Set(gblAP_SelectedProjectId, cmpAPAS_GlobalTopBar_PI01.PendingProjectId);
                          Select(btnAPAS_LoadProjectData_1)
                        ProjectLabel: ="Project"
                        ProjectMode: ="SELECTOR"
                        Projects: =colAP_Projects
                        SelectedProjectCode: =Coalesce(gblAP_SelectedProjectCode,"")
                        SelectedProjectId: =Coalesce(gblAP_SelectedProjectId,"")
                        SelectedProjectName: =Coalesce(gblAP_SelectedProjectName,"")
                        ShowProjectContext: =true
                        ShowUserIdentity: =true
                        UserDisplayName: =User().FullName
                        UserRoleText: =""
                        Width: =Parent.Width
                  - conAPAS_Body:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue("#F6F9FC")
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        PaddingBottom: =16
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =14
                        Width: =Parent.Width
                      Children:
                        - cmpAPAS_PageHeader:
                            Control: CanvasComponent
                            ComponentName: cmp_AP_PageHeaderPro
                            Properties:
                              Height: =80
                              IconKey: ="AssetsIdentity"
                              ShowIcon: =true
                              Subtitle: ="Live ALEP equipment inventory"
                              Title: ="Assets"
                              Width: =Parent.Width
                        - conAPAS_CandidateBanner_1:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =If(Upper(Coalesce(varAPAS_SummaryReadState,"UNAVAILABLE"))="READY",ColorValue("#B9E8D5"),ColorValue("#F0D9A7"))
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =If(Upper(Coalesce(varAPAS_SummaryReadState,"UNAVAILABLE"))="READY",RGBA(31,169,113,0.05),RGBA(242,169,59,0.08))
                              FillPortions: =0
                              Height: =32
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              PaddingLeft: =12
                              PaddingRight: =12
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =Parent.Width
                            Children:
                              - lblAPAS_CandidateBanner_1:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =If(Upper(Coalesce(varAPAS_SummaryReadState,"UNAVAILABLE"))="READY",ColorValue("#28715A"),ColorValue("#9A6200"))
                                    Fill: =Color.Transparent
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    Size: =8
                                    Text: =If(IsBlank(Trim(Coalesce(gblAP_SelectedProjectCode,""))),"SELECT A PROJECT TO LOAD ASSETS",If(CountRows(colAPAS_AssetsView)=0,"NO ALEP CURRENT EQUIPMENT IS AVAILABLE IN THIS PROJECT CONTEXT",If(Upper(Coalesce(varAPAS_SummaryReadState,"UNAVAILABLE"))="READY","ALEP CURRENT · PRODUCTIVE RECONCILIATION SNAPSHOT · "&Upper(Coalesce(varAPAS_FreshnessStatus,"UNAVAILABLE")),"ALEP CURRENT · RECONCILIATION "&Upper(Coalesce(varAPAS_FreshnessStatus,"UNAVAILABLE"))&" · HCS/PRESERVATION FIELDS UNAVAILABLE")))
                                    Width: =Parent.Width
                                    Wrap: =false
                        - cmpAPAS_Kpis_1:
                            Control: CanvasComponent
                            ComponentName: cmp_AP_KpiStripPro
                            Properties:
                              Height: =82
                              Metrics: |-
                                =Table(
                                    {Order:10,Key:"TOTAL",Title:"Assets",ValueText:If(IsBlank(Trim(Coalesce(gblAP_SelectedProjectCode,""))),"—",Text(CountRows(colAPAS_AssetsView))),SupportingText:"Assets in the current project",IconKey:"KPI_ASSETS_IN_SCOPE",IconUri:Coalesce(LookUp(colAPIconCatalog,Key="KPI_ASSETS_IN_SCOPE" && IsApproved,IconUri),LookUp(colAPIconCatalog,Key="DOMAIN_ASSET" && IsApproved,IconUri),""),Tone:"INFO",State:If(IsBlank(Trim(Coalesce(gblAP_SelectedProjectCode,""))),"UNAVAILABLE","READY"),IsInteractive:false},
                                    {Order:20,Key:"EQUIPMENT_TYPES",Title:"Equipment Types",ValueText:Text(CountRows(Distinct(Filter(colAPAS_AssetsView,!IsBlank(Trim(Coalesce(EquipmentType,"")))),EquipmentType))),SupportingText:"Source equipment types in ALEP",IconKey:"DOMAIN_ASSET",IconUri:Coalesce(LookUp(colAPIconCatalog,Key="DOMAIN_ASSET" && IsApproved,IconUri),""),Tone:"SUCCESS",State:"READY",IsInteractive:false},
                                    {Order:30,Key:"FAMILIES",Title:"Families",ValueText:Text(CountRows(Filter(colAPAS_FamilyTree,FamilyKey<>"ALL_ENGINEERED_EQUIPMENT"))),SupportingText:"Families available in scope",IconKey:"DOMAIN_ASSET",IconUri:Coalesce(LookUp(colAPIconCatalog,Key="DOMAIN_ASSET" && IsApproved,IconUri),""),Tone:"INFO",State:"READY",IsInteractive:false},
                                    {Order:40,Key:"UNRESOLVED",Title:"Unresolved Types",ValueText:Text(CountRows(Distinct(Filter(colAPAS_AssetsView,Upper(Coalesce(FamilyResolutionState,""))="UNRESOLVED"),EquipmentType))),SupportingText:"Types without family resolution",IconKey:"KPI_EXCEPTIONS",IconUri:Coalesce(LookUp(colAPIconCatalog,Key="KPI_EXCEPTIONS" && IsApproved,IconUri),""),Tone:"WARNING",State:"READY",IsInteractive:false}
                                )
                              OnMetricSelect: =Set(varAPAS_LastEvent,"KPI:"&p_key)
                              Width: =Parent.Width
                        - conAPAS_FilterToolbar_1:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =50
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              Width: =Parent.Width
                            Children:
                              - conAPAS_SearchHost_1:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderColor: =ColorValue("#D9E3EF")
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.White
                                    Height: =44
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Width: =330
                                  Children:
                                    - imgAPAS_Search_1:
                                        Control: Image@2.2.3
                                        Properties:
                                          BorderColor: =RGBA(0,0,0,0)
                                          BorderStyle: =BorderStyle.None
                                          Height: =20
                                          Image: ='ap-search'
                                          Width: =20
                                          X: =12
                                          Y: =12
                                    - txtAPAS_Search_1:
                                        Control: Classic/TextInput@2.3.2
                                        Properties:
                                          BorderColor: =RGBA(0,0,0,0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =0
                                          Color: =ColorValue("#12304D")
                                          Default: =varAPAS_SearchText
                                          DisabledBorderColor: =RGBA(0,0,0,0)
                                          DisabledColor: =ColorValue("#7F95AA")
                                          DisabledFill: =ColorValue("#F8FAFC")
                                          DisplayMode: =If(varAPAS_IsBusy || varAPAS_DossierBusy,DisplayMode.Disabled,DisplayMode.Edit)
                                          Fill: =Color.Transparent
                                          Font: =Font.'Segoe UI'
                                          Height: =36
                                          HintText: ="Search tags, equipment types, commodities or descriptions..."
                                          HoverBorderColor: =RGBA(0,0,0,0)
                                          HoverFill: =Color.Transparent
                                          OnChange: =Set(varAPAS_SearchText,Self.Text)
                                          PaddingLeft: =4
                                          Size: =9
                                          Width: |
                                            =Parent.Width - 20
                                          X: =20
                                          Y: =4
                              - conAPAS_FilterEquipmentType_1:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    Height: =46
                                    LayoutDirection: =LayoutDirection.Vertical
                                    Width: =154
                                  Children:
                                    - lblAPAS_FilterEquipmentType_1:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =ColorValue("#5E738C")
                                          Fill: =Color.Transparent
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =12
                                          Size: =7
                                          Text: ="EQUIPMENT TYPE"
                                          Width: =Parent.Width
                                          Wrap: =false
                                    - ddAPAS_FilterEquipmentType_1:
                                        Control: ModernDropdown@1.0.2
                                        Properties:
                                          AccessibleLabel: ="Filter Assets by Equipment Type"
                                          Appearance: =Appearance.Outline
                                          Default: =First(Blank())
                                          DisplayMode: =If(varAPAS_IsBusy || varAPAS_DossierBusy,DisplayMode.Disabled,DisplayMode.Edit)
                                          Height: =34
                                          ItemDisplayText: =ThisItem.Value
                                          Items: =Sort(Distinct(Filter(colAPAS_AssetsView,!IsBlank(Trim(EquipmentType))),EquipmentType),Value,SortOrder.Ascending)
                                          OnChange: |-
                                            =Reset(ddAPAS_FilterCommodity_1);
                                            Set(
                                                varAPAS_LastEvent,
                                                "FILTER_EQUIPMENT_TYPE:" & Coalesce(Self.Selected.Value,"ALL")
                                            )
                                          Width: =Parent.Width
                              - conAPAS_FilterCommodity_1:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    Height: =46
                                    LayoutDirection: =LayoutDirection.Vertical
                                    Width: =140
                                  Children:
                                    - lblAPAS_FilterCommodity_1:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =ColorValue("#5E738C")
                                          Fill: =Color.Transparent
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =12
                                          Size: =7
                                          Text: ="COMMODITY"
                                          Width: =Parent.Width
                                          Wrap: =false
                                    - ddAPAS_FilterCommodity_1:
                                        Control: ModernDropdown@1.0.2
                                        Properties:
                                          AccessibleLabel: ="Filter Assets by Commodity Code"
                                          Appearance: =Appearance.Outline
                                          Default: =First(Blank())
                                          DisplayMode: =If(varAPAS_IsBusy || varAPAS_DossierBusy,DisplayMode.Disabled,DisplayMode.Edit)
                                          Height: =34
                                          ItemDisplayText: =ThisItem.Value
                                          Items: |-
                                            =Sort(
                                                Distinct(
                                                    Filter(
                                                        colAPAS_AssetsView,
                                                        !IsBlank(Trim(CommodityCode)) &&
                                                        (
                                                            IsBlank(ddAPAS_FilterEquipmentType_1.Selected.Value) ||
                                                            EquipmentType = ddAPAS_FilterEquipmentType_1.Selected.Value
                                                        )
                                                    ),
                                                    CommodityCode
                                                ),
                                                Value,
                                                SortOrder.Ascending
                                            )
                                          OnChange: =Set(varAPAS_LastEvent,"FILTER_COMMODITY:"&Coalesce(Self.Selected.Value,"ALL"))
                                          Width: =Parent.Width
                              - conAPAS_FilterReconStatus_1:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    Height: =46
                                    LayoutDirection: =LayoutDirection.Vertical
                                    Visible: =false
                                    Width: =168
                                  Children:
                                    - lblAPAS_FilterReconStatus_1:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =ColorValue("#5E738C")
                                          Fill: =Color.Transparent
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =12
                                          Size: =7
                                          Text: ="RECONCILIATION"
                                          Width: =Parent.Width
                                          Wrap: =false
                                    - ddAPAS_FilterReconStatus_1:
                                        Control: ModernDropdown@1.0.2
                                        Properties:
                                          AccessibleLabel: ="Filter Assets by Reconciliation Status"
                                          Appearance: =Appearance.Outline
                                          Default: =First(Blank())
                                          DisplayMode: =If(varAPAS_IsBusy || varAPAS_DossierBusy,DisplayMode.Disabled,DisplayMode.Edit)
                                          Height: =34
                                          ItemDisplayText: =ThisItem.Value
                                          Items: =Sort(Distinct(Filter(colAPAS_AssetsView,!IsBlank(Trim(ReconciliationStatus))),ReconciliationStatus),Value,SortOrder.Ascending)
                                          OnChange: =Set(varAPAS_LastEvent,"FILTER_RECON:"&Coalesce(Self.Selected.Value,"ALL"))
                                          Width: =Parent.Width
                              - conAPAS_FilterHcsState_1:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    Height: =46
                                    LayoutDirection: =LayoutDirection.Vertical
                                    Visible: =false
                                    Width: =132
                                  Children:
                                    - lblAPAS_FilterHcsState_1:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =ColorValue("#5E738C")
                                          Fill: =Color.Transparent
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =12
                                          Size: =7
                                          Text: ="HCS STATE"
                                          Width: =Parent.Width
                                          Wrap: =false
                                    - ddAPAS_FilterHcsState_1:
                                        Control: ModernDropdown@1.0.2
                                        Properties:
                                          AccessibleLabel: ="Filter Assets by HCS State"
                                          Appearance: =Appearance.Outline
                                          Default: =First(Blank())
                                          DisplayMode: =If(varAPAS_IsBusy || varAPAS_DossierBusy,DisplayMode.Disabled,DisplayMode.Edit)
                                          Height: =34
                                          ItemDisplayText: =ThisItem.Value
                                          Items: =Sort(Distinct(Filter(colAPAS_AssetsView,!IsBlank(Trim(HcsResolutionStatus))),HcsResolutionStatus),Value,SortOrder.Ascending)
                                          OnChange: =Set(varAPAS_LastEvent,"FILTER_HCS:"&Coalesce(Self.Selected.Value,"ALL"))
                                          Width: =Parent.Width
                              - btnAPAS_ClearFilters_1:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Transparent
                                    BasePaletteColor: =ColorValue("#082B6F")
                                    DisplayMode: |-
                                      =If(
                                          !varAPAS_IsBusy &&
                                          !varAPAS_DossierBusy &&
                                          (
                                              !IsBlank(Trim(varAPAS_SearchText)) ||
                                              !IsBlank(ddAPAS_FilterEquipmentType_1.Selected.Value) ||
                                              !IsBlank(ddAPAS_FilterReconStatus_1.Selected.Value) ||
                                              !IsBlank(ddAPAS_FilterHcsState_1.Selected.Value) ||
                                              !IsBlank(ddAPAS_FilterCommodity_1.Selected.Value)
                                          ),
                                          DisplayMode.Edit,
                                          DisplayMode.Disabled
                                      )
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    OnSelect: |-
                                      =Set(varAPAS_SearchText,"");
                                      Reset(txtAPAS_Search_1);
                                      Reset(ddAPAS_FilterEquipmentType_1);
                                      Reset(ddAPAS_FilterReconStatus_1);
                                      Reset(ddAPAS_FilterHcsState_1);
                                      Reset(ddAPAS_FilterCommodity_1);
                                      Set(varAPAS_LastEvent,"CLEAR_FILTERS")
                                    Text: ="Clear filters"
                                    Width: =92
                        - conAPAS_MasterDetail_1:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              Width: =Parent.Width
                            Children:
                              - conAPAS_ScopeTree:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =ColorValue("#D9E3EF")
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.White
                                    FillPortions: =3
                                    Height: =Parent.Height
                                    LayoutDirection: =LayoutDirection.Vertical
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    Width: =Parent.Width
                                  Children:
                                    - lblAPAS_ScopeTreeTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =ColorValue("#0B3558")
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =28
                                          Size: =12
                                          Text: ="Equipment scope"
                                          Width: =Parent.Width
                                    - lblAPAS_ScopeTreeMeta:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =ColorValue("#6B7F93")
                                          Font: =Font.'Segoe UI'
                                          Height: =24
                                          Size: =9
                                          Text: =Text(CountRows(Filter(colAPAS_FamilyTree,FamilyKey<>"ALL_ENGINEERED_EQUIPMENT")))&" families · "&Text(CountRows(colAPAS_AssetsView))&" assets"
                                          Width: =Parent.Width
                                    - lblAPAS_ScopeTreeColumns:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =ColorValue("#7F95AA")
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =18
                                          Size: =8
                                          Text: ="NAME"
                                          Width: =Parent.Width
                                          Wrap: =false
                                    - lblAPAS_ScopeTreeTypesHeader:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Right
                                          Color: =ColorValue("#7F95AA")
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =18
                                          Size: =8
                                          Text: ="TYPES"
                                          Width: =45
                                          Wrap: =false
                                          X: =Parent.Width-105
                                    - lblAPAS_ScopeTreeAssetsHeader:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Right
                                          Color: =ColorValue("#7F95AA")
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =18
                                          Size: =8
                                          Text: ="ASSETS"
                                          Width: =55
                                          Wrap: =false
                                          X: =Parent.Width-58
                                    - galAPAS_ScopeTree:
                                        Control: Gallery@2.15.0
                                        Variant: Vertical
                                        Properties:
                                          AccessibleLabel: ="Equipment scope tree"
                                          BorderColor: =ColorValue("#E2EAF2")
                                          Fill: =Color.White
                                          Height: =Parent.Height-Self.Y-8
                                          Items: |-
                                            =With(
                                                {
                                                    treeRows:colAPAS_FamilyTree,
                                                    expandedKeys:"|"&Upper(Coalesce(varAPAS_ExpandedFamilyKeys,""))&"|"
                                                },
                                                SortByColumns(
                                                    Filter(
                                                        treeRows As node,
                                                        node.FamilyKey="ALL_ENGINEERED_EQUIPMENT" ||
                                                        (
                                                            IsBlank(node.FamilyParentKey) &&
                                                            Find("|ALL_ENGINEERED_EQUIPMENT|",expandedKeys)>0
                                                        ) ||
                                                        With(
                                                            {p1:LookUp(treeRows,Upper(Trim(Text(FamilyKey)))=Upper(Trim(Text(node.FamilyParentKey))))},
                                                            With(
                                                                {p2:LookUp(treeRows,Upper(Trim(Text(FamilyKey)))=Upper(Trim(Text(p1.FamilyParentKey))))},
                                                                With(
                                                                    {p3:LookUp(treeRows,Upper(Trim(Text(FamilyKey)))=Upper(Trim(Text(p2.FamilyParentKey))))},
                                                                    With(
                                                                        {p4:LookUp(treeRows,Upper(Trim(Text(FamilyKey)))=Upper(Trim(Text(p3.FamilyParentKey))))},
                                                                        Find("|"&Upper(Trim(Text(node.FamilyParentKey)))&"|",expandedKeys)>0 &&
